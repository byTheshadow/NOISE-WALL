<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VOIR // 虚空回响</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+SC:wght@300;600;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div class="noise-overlay"></div>
  <canvas id="webgl-canvas"></canvas>

  <!-- 顶部状态栏 -->
  <header class="hud-header">
    <div class="hud-tag">// NOISE_SYSTEM.V4</div>
    <div class="hud-status" id="system-status">STATUS: STANDBY</div>
  </header>

  <!-- 五线谱漫游时的引导提示 -->
  <div id="stave-guide-tip" class="stave-guide-tip">
    <span class="guide-cross">✦</span>
    <span>空间已校准 · 请点击选择一个音轨盲盒</span>
    <span class="guide-cross">✦</span>
  </div>

  <!-- 第 1 幕：虚空音波启动页 -->
  <section id="screen-intro" class="screen-overlay active">
    <div class="intro-content">
      <p class="sub-lead">[ 频 率 校 准 仪 式 ]</p>
      <h1 class="main-title">SONIC VOID</h1>
      <p class="intro-desc">虚空之中，唯有共振得以穿透物质。<br>佩戴耳机，以获取最佳动态声场。</p>
      <button id="btn-enter" class="noir-btn">
        <span class="btn-text">/// 拨动琴弦 · 启封音轨</span>
      </button>
    </div>
  </section>

  <!-- 第 3 & 4 幕：盲盒交互 HUD 界面 -->
  <section id="screen-box-ui" class="screen-overlay pointer-events-none">
    <div class="box-hud-container pointer-events-auto">
      <div id="track-indicator" class="track-info">TRACK: --</div>

      <!-- 摇晃线索浮现面板 -->
      <div id="clue-deck" class="clue-deck">
        <div class="clue-item" id="clue-1"></div>
        <div class="clue-item" id="clue-2"></div>
        <div class="clue-item" id="clue-3"></div>
      </div>

      <!-- 交互控制面板 -->
      <div class="interaction-prompt" id="shake-prompt">
        <span id="prompt-text">摇晃设备 或 鼠标左右拖拽盒体</span>
        <div class="shake-progress-bar">
          <div class="shake-progress-fill" id="shake-fill"></div>
        </div>
      </div>

      <!-- 抉择按键组 -->
      <div class="decision-group" id="decision-group">
        <button id="btn-cancel" class="noir-btn ghost-btn">
          <span class="btn-text">↺ 封存 · 换一个音轨</span>
        </button>
        <button id="btn-unlock" class="noir-btn highlight-btn">
          <span class="btn-text">✦ 确认破壳解密</span>
        </button>
      </div>
    </div>
  </section>

  <!-- 第 5 幕 / 归档页：已解密档案卡片 -->
  <section id="screen-manifest" class="screen-overlay pointer-events-none">
    <div class="manifest-wrapper pointer-events-auto" id="manifest-card">
      <div class="manifest-header">
        <span class="manifest-badge">[ PERMANENT ARCHIVE ]</span>
        <span class="manifest-id" id="manifest-code">AUTH-000</span>
      </div>
      <div class="manifest-body">
        <h2 class="manifest-title" id="manifest-title">TITLE</h2>
        <div class="manifest-divider"></div>
        <p class="manifest-text" id="manifest-text">TEXT</p>
      </div>
      <div class="manifest-footer">
        <span class="stamp-verified">// CERTIFIED PURE BLACK</span>
        <span class="timestamp" id="manifest-time">TIMESTAMP</span>
      </div>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
